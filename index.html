<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flo – Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111318;
  --surface:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.07);
  --accent:#C8FF5F;
  --accent-dark:#0D1007;
  --text:#F9FAFB;
  --text-muted:#9CA3AF;
  --text-dim:#4B5563;
  --text-dimmer:#2D3139;
  --radius:14px;
  --delete-bg:#D96C6C;
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;
  top:-150px;right:-100px;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(200,255,95,0.055) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
.container{max-width:1100px;margin:0 auto;padding:28px 20px;position:relative;z-index:1}
.glass{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(12px)}

/* SYNC STATUS */
#syncStatus{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  font-family:'Outfit',sans-serif;font-size:0.75rem;font-weight:500;
  padding:6px 14px;border-radius:50px;z-index:9999;
  transition:all .3s;pointer-events:none;
  background:rgba(200,255,95,0.1);border:1px solid rgba(200,255,95,0.2);color:#C8FF5F;
  opacity:0;
}
#syncStatus.show{opacity:1}
#syncStatus.err{background:rgba(217,108,108,0.12);border-color:rgba(217,108,108,0.25);color:#D96C6C}
#syncStatus.loading{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:#9CA3AF}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.logo{font-size:1.4rem;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
.logo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.month-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:6px 14px}
.month-pill button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1rem;line-height:1;transition:color .15s}
.month-pill button:hover{color:var(--text-muted)}
.month-label{font-family:'Outfit',sans-serif;font-size:0.8rem;font-weight:500;color:var(--text-muted);min-width:110px;text-align:center}
.btn{font-family:'Outfit',sans-serif;font-size:0.82rem;font-weight:500;padding:8px 18px;border:none;border-radius:50px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-accent{background:var(--accent);color:var(--accent-dark);font-weight:600}
.btn-accent:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text-muted)}
.btn-ghost:hover{background:rgba(255,255,255,0.07)}

/* ADD FORM */
.add-panel{padding:18px 22px;margin-bottom:16px}
.form-label{font-size:0.63rem;font-weight:500;letter-spacing:0.7px;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px}
.form-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.form-group{display:flex;flex-direction:column;flex:1;min-width:130px}
.form-group input,.form-group select{
  background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;
  padding:10px 13px;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.88rem;
  outline:none;transition:border .2s,background .2s;-webkit-appearance:none;
}
.form-group input:focus,.form-group select:focus{border-color:rgba(200,255,95,0.4);background:rgba(255,255,255,0.06)}
.form-group select option{background:#1a1d24;color:var(--text)}
.form-group input::placeholder{color:var(--text-dimmer)}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.4);cursor:pointer}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.stat-card{padding:16px 18px;transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-lbl{font-size:0.62rem;font-weight:500;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px}
.stat-val{font-size:1.55rem;font-weight:600;color:var(--text);line-height:1}
.stat-val.accent{color:var(--accent)}
.stat-sub{font-size:0.7rem;color:var(--text-dimmer);margin-top:3px}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:640px){.charts-row{grid-template-columns:1fr}}
.chart-card{padding:18px 20px;display:flex;flex-direction:column}
.chart-lbl{font-size:0.62rem;font-weight:500;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-dim);margin-bottom:14px}
.chart-wrap{flex:1;position:relative;min-height:190px}

/* TABLE */
.table-card{padding:18px 20px}
.table-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.table-title{font-size:0.62rem;font-weight:500;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-dim)}
.hint-text{font-size:0.68rem;color:var(--text-dimmer)}

/* SWIPE ROW */
.swipe-list{display:flex;flex-direction:column;gap:2px}
.swipe-container{position:relative;border-radius:10px;overflow:hidden;height:46px;margin-bottom:2px;transition:height .25s ease,margin .25s ease}
.delete-bg{
  position:absolute;inset:0;background:var(--delete-bg);
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:20px;border-radius:10px;opacity:0;transition:opacity .1s;
}
.delete-bg .del-label{font-size:0.78rem;font-weight:600;color:#fff;letter-spacing:0.3px}
.swipe-row{
  position:absolute;inset:0;display:flex;align-items:center;
  padding:0 14px;background:#111318;border:1px solid var(--border);
  border-radius:10px;cursor:grab;user-select:none;
  transition:transform .25s cubic-bezier(.4,0,.2,1);gap:12px;will-change:transform;
}
.swipe-row:active{cursor:grabbing}
.swipe-row.deleting{transform:translateX(-110%) !important;transition:transform .28s cubic-bezier(.4,0,.2,1);opacity:0}
.col-date{font-size:0.76rem;color:var(--text-muted);min-width:52px;flex-shrink:0}
.col-cat{flex:1}
.col-amt{font-size:0.85rem;font-weight:600;color:var(--text);min-width:62px;text-align:right;flex-shrink:0}
.cat-badge{display:inline-block;padding:3px 10px;border-radius:50px;font-size:0.67rem;font-weight:500}

/* CATEGORY BADGE COLORS */
.cat-Bars{background:rgba(110,231,183,0.12);color:#6EE7B7}
.cat-Car-Expenses{background:rgba(107,114,128,0.12);color:#9CA3AF}
.cat-Fuel{background:rgba(156,163,175,0.1);color:#9CA3AF}
.cat-Gifts{background:rgba(110,231,183,0.1);color:#6EE7B7}
.cat-Groceries{background:rgba(52,211,153,0.12);color:#34D399}
.cat-Gym{background:rgba(200,255,95,0.1);color:#BBFF4A}
.cat-Health-Self-care{background:rgba(52,211,153,0.12);color:#34D399}
.cat-Leisure{background:rgba(200,255,95,0.08);color:#A8D940}
.cat-Parking{background:rgba(156,163,175,0.1);color:#9CA3AF}
.cat-Personal{background:rgba(255,255,255,0.07);color:#D1D5DB}
.cat-Restaurants{background:rgba(200,255,95,0.12);color:#C8FF5F}
.cat-Shopping{background:rgba(167,243,208,0.12);color:#A7F3D0}
.cat-Subscriptions{background:rgba(156,163,175,0.08);color:#6B7280}
.cat-Tennis{background:rgba(110,231,183,0.12);color:#6EE7B7}
.cat-Therapy{background:rgba(229,231,235,0.07);color:#9CA3AF}
.cat-Others{background:rgba(255,255,255,0.05);color:#6B7280}

.empty-state{text-align:center;padding:36px;color:var(--text-dim);font-size:0.9rem}
.empty-icon{font-size:2rem;margin-bottom:8px}

#toast{position:fixed;bottom:24px;right:24px;padding:11px 18px;border-radius:10px;font-size:0.85rem;font-family:'Outfit',sans-serif;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:rgba(200,255,95,0.12);border:1px solid rgba(200,255,95,0.25);color:#C8FF5F}
#toast.err{background:rgba(217,108,108,0.12);border:1px solid rgba(217,108,108,0.25);color:#D96C6C}

@media(max-width:580px){
  .form-group{min-width:100%}
  .form-row{flex-direction:column}
  .stat-val{font-size:1.25rem}
  .logo{font-size:1.2rem}
  .hint-text{display:none}
}
</style>
</head>
<body>

<div id="syncStatus"></div>

<div class="container">
  <header>
    <div class="logo">flo<span>.</span></div>
    <div class="header-right">
      <div class="month-pill">
        <button id="prevMonth">&#8249;</button>
        <span class="month-label" id="monthLabel">–</span>
        <button id="nextMonth">&#8250;</button>
      </div>
      <button class="btn btn-ghost" id="exportBtn">&#128196; Export PDF</button>
    </div>
  </header>

  <div class="glass add-panel">
    <div class="form-row">
      <div class="form-group" style="max-width:160px">
        <div class="form-label">Amount</div>
        <input type="number" id="amountInput" placeholder="$0.00" min="0" step="0.01">
      </div>
      <div class="form-group" style="flex:2">
        <div class="form-label">Category</div>
        <select id="categoryInput">
          <option value="">Select category</option>
          <option>Bars</option>
          <option>Car Expenses</option>
          <option>Fuel</option>
          <option>Gifts</option>
          <option>Groceries</option>
          <option>Gym</option>
          <option>Health/Self-care</option>
          <option>Leisure</option>
          <option>Parking</option>
          <option>Personal</option>
          <option>Restaurants</option>
          <option>Shopping</option>
          <option>Subscriptions</option>
          <option>Tennis</option>
          <option>Therapy</option>
          <option>Others</option>
        </select>
      </div>
      <div class="form-group" style="max-width:170px">
        <div class="form-label">Date</div>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group" style="max-width:100px;justify-content:flex-end">
        <button class="btn btn-accent" id="addBtn" style="width:100%;justify-content:center;border-radius:9px">Add</button>
      </div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="glass stat-card"><div class="stat-lbl">Total Spent</div><div class="stat-val" id="totalSpent">$0.00</div><div class="stat-sub">this month</div></div>
    <div class="glass stat-card"><div class="stat-lbl">Top Category</div><div class="stat-val accent" id="topCat" style="font-size:1.1rem">–</div><div class="stat-sub" id="topCatAmt">–</div></div>
    <div class="glass stat-card"><div class="stat-lbl">Transactions</div><div class="stat-val accent" id="expCount">0</div><div class="stat-sub">this month</div></div>
    <div class="glass stat-card"><div class="stat-lbl">Daily Avg</div><div class="stat-val" id="dailyAvg">$0.00</div><div class="stat-sub">per day</div></div>
  </div>

  <div class="charts-row" id="chartsSection">
    <div class="glass chart-card"><div class="chart-lbl">By Category</div><div class="chart-wrap"><canvas id="doughnutChart"></canvas></div></div>
    <div class="glass chart-card"><div class="chart-lbl">Spending Over Time</div><div class="chart-wrap"><canvas id="barChart"></canvas></div></div>
  </div>

  <div class="glass table-card">
    <div class="table-hdr">
      <div class="table-title">Expenses</div>
      <div class="hint-text">&#8592; swipe to delete</div>
    </div>
    <div class="swipe-list" id="swipeList"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">&#127807;</div>
      <div>No expenses this month. Add one above!</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNxflCWz-D6J2CJHnqn2ZT3TKRdHWJGCQ",
  authDomain: "flo-expense.firebaseapp.com",
  projectId: "flo-expense",
  storageBucket: "flo-expense.firebasestorage.app",
  messagingSenderId: "18693535688",
  appId: "1:18693535688:web:8c2a5303a38ef97b6232fd",
  measurementId: "G-3MLE6QY31S"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const expensesCol = collection(db, "expenses");

let viewDate = new Date();
let allExpenses = [];
let doughnutChart = null, barChart = null;

// Solid colors for pie chart — same palette, fully opaque
const CAT_COLORS = {
  'Bars':           '#6EE7B7',
  'Car Expenses':   '#9CA3AF',
  'Fuel':           '#A8A29E',
  'Gifts':          '#86EFAC',
  'Groceries':      '#34D399',
  'Gym':            '#BBFF4A',
  'Health/Self-care':'#2DD4BF',
  'Leisure':        '#A8D940',
  'Parking':        '#D1D5DB',
  'Personal':       '#E5E7EB',
  'Restaurants':    '#C8FF5F',
  'Shopping':       '#A7F3D0',
  'Subscriptions':  '#6B7280',
  'Tennis':         '#6EE7B7',
  'Therapy':        '#9CA3AF',
  'Others':         '#4B5563'
};

function catClass(cat){return 'cat-'+cat.replace(/[\/\s]/g,'-')}
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function fmtAmt(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtDate(s){const[y,m,d]=s.split('-');return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}

function showSync(msg,type='ok'){
  const el=document.getElementById('syncStatus');
  el.textContent=msg;el.className=type+' show';
  setTimeout(()=>el.classList.remove('show'),2000);
}
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=type;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function updateMonthLabel(){
  document.getElementById('monthLabel').textContent=viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const now=new Date();
  const isCurrent=viewDate.getFullYear()===now.getFullYear()&&viewDate.getMonth()===now.getMonth();
  document.getElementById('nextMonth').style.opacity=isCurrent?'0.25':'1';
}
document.getElementById('prevMonth').onclick=()=>{
  viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);
  updateMonthLabel();render();
};
document.getElementById('nextMonth').onclick=()=>{
  const now=new Date();
  if(viewDate.getFullYear()===now.getFullYear()&&viewDate.getMonth()===now.getMonth())return;
  viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);
  updateMonthLabel();render();
};

document.getElementById('dateInput').value=new Date().toISOString().split('T')[0];
document.getElementById('addBtn').onclick=async()=>{
  const amt=parseFloat(document.getElementById('amountInput').value);
  const cat=document.getElementById('categoryInput').value;
  const date=document.getElementById('dateInput').value;
  if(!amt||amt<=0){toast('Enter a valid amount','err');return;}
  if(!cat){toast('Pick a category','err');return;}
  if(!date){toast('Pick a date','err');return;}
  const btn=document.getElementById('addBtn');
  btn.textContent='...';btn.disabled=true;
  try{
    await addDoc(expensesCol,{amount:amt,category:cat,date,createdAt:Date.now()});
    document.getElementById('amountInput').value='';
    document.getElementById('categoryInput').value='';
    document.getElementById('dateInput').value=new Date().toISOString().split('T')[0];
    const[y,m]=date.split('-');
    viewDate=new Date(parseInt(y),parseInt(m)-1,1);
    updateMonthLabel();
    toast('Added! 💸');
  }catch(e){toast('Failed to save','err');console.error(e);}
  btn.textContent='Add';btn.disabled=false;
};

showSync('Connecting...','loading');
const q=query(expensesCol,orderBy('createdAt','desc'));
onSnapshot(q,(snapshot)=>{
  allExpenses=snapshot.docs.map(d=>({id:d.id,...d.data()}));
  render();
  showSync('Synced ✓');
},(err)=>{
  console.error(err);
  showSync('Sync error','err');
});

function getMonthExpenses(){
  const mk=monthKey(viewDate);
  return allExpenses.filter(e=>e.date&&e.date.startsWith(mk)).sort((a,b)=>b.date.localeCompare(a.date));
}

function render(){
  const expenses=getMonthExpenses();
  renderStats(expenses);
  renderCharts(expenses);
  renderSwipeList(expenses);
}

function renderStats(expenses){
  const total=expenses.reduce((s,e)=>s+e.amount,0);
  document.getElementById('totalSpent').textContent=fmtAmt(total);
  document.getElementById('expCount').textContent=expenses.length;
  const catTotals={};
  expenses.forEach(e=>{catTotals[e.category]=(catTotals[e.category]||0)+e.amount});
  const sorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  if(sorted.length){
    document.getElementById('topCat').textContent=sorted[0][0];
    document.getElementById('topCatAmt').textContent=fmtAmt(sorted[0][1]);
  }else{
    document.getElementById('topCat').textContent='–';
    document.getElementById('topCatAmt').textContent='–';
  }
  const now=new Date();
  const isCurrent=viewDate.getFullYear()===now.getFullYear()&&viewDate.getMonth()===now.getMonth();
  const days=isCurrent?now.getDate():new Date(viewDate.getFullYear(),viewDate.getMonth()+1,0).getDate();
  document.getElementById('dailyAvg').textContent=fmtAmt(days?total/days:0);
}

function renderCharts(expenses){
  const catTotals={};
  expenses.forEach(e=>{catTotals[e.category]=(catTotals[e.category]||0)+e.amount});
  const labels=Object.keys(catTotals);
  const values=labels.map(l=>catTotals[l]);
  // solid colors — no transparency
  const colors=labels.map(l=>CAT_COLORS[l]||'#6B7280');

  if(doughnutChart)doughnutChart.destroy();
  doughnutChart=new Chart(document.getElementById('doughnutChart'),{
    type:'doughnut',
    data:{labels,datasets:[{
      data:values,
      backgroundColor:colors,
      borderColor:'#111318',
      borderWidth:2,
      hoverOffset:6
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{
          position:'bottom',
          labels:{
            color:'rgba(255,255,255,0.5)',
            font:{family:'Outfit',size:10},
            padding:10,boxWidth:8,
            usePointStyle:true,pointStyle:'circle'
          }
        },
        tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmtAmt(ctx.parsed)}`}}
      },
      animation:{animateScale:true,duration:600}
    }
  });

  const dayTotals={};
  expenses.forEach(e=>{dayTotals[e.date]=(dayTotals[e.date]||0)+e.amount});
  const dayLabels=Object.keys(dayTotals).sort();
  const dayValues=dayLabels.map(d=>dayTotals[d]);
  const maxVal=Math.max(...dayValues,1);

  if(barChart)barChart.destroy();
  barChart=new Chart(document.getElementById('barChart'),{
    type:'bar',
    data:{
      labels:dayLabels.map(d=>fmtDate(d)),
      datasets:[{
        data:dayValues,
        backgroundColor:dayValues.map(v=>v===maxVal?'#C8FF5F':'rgba(255,255,255,0.06)'),
        borderColor:dayValues.map(v=>v===maxVal?'#C8FF5F':'rgba(255,255,255,0.09)'),
        borderWidth:1,borderRadius:4,hoverBackgroundColor:'#C8FF5F55'
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>fmtAmt(ctx.parsed.y)}}},
      scales:{
        x:{ticks:{color:'rgba(255,255,255,0.22)',font:{family:'Outfit',size:10}},grid:{display:false},border:{display:false}},
        y:{ticks:{color:'rgba(255,255,255,0.22)',font:{family:'Outfit',size:10},callback:v=>'$'+v},grid:{color:'rgba(255,255,255,0.04)'},border:{display:false}}
      },
      animation:{duration:500}
    }
  });
}

function renderSwipeList(expenses){
  const list=document.getElementById('swipeList');
  const empty=document.getElementById('emptyState');
  list.innerHTML='';
  if(!expenses.length){empty.style.display='block';return;}
  empty.style.display='none';

  expenses.forEach(e=>{
    const wrap=document.createElement('div');
    wrap.className='swipe-container';

    const bg=document.createElement('div');
    bg.className='delete-bg';
    bg.innerHTML='<span class="del-label">Delete</span>';

    const row=document.createElement('div');
    row.className='swipe-row';
    row.innerHTML=`
      <span class="col-date">${fmtDate(e.date)}</span>
      <span class="col-cat"><span class="cat-badge ${catClass(e.category)}">${e.category}</span></span>
      <span class="col-amt">${fmtAmt(e.amount)}</span>
    `;

    wrap.appendChild(bg);
    wrap.appendChild(row);
    list.appendChild(wrap);

    let startX=0,currentX=0,isDragging=false;
    const THRESHOLD=90;

    function onStart(x){startX=x;isDragging=true;row.style.transition='none';}
    function onMove(x){
      if(!isDragging)return;
      currentX=Math.min(0,x-startX);
      row.style.transform=`translateX(${currentX}px)`;
      bg.style.opacity=Math.min(1,Math.abs(currentX)/THRESHOLD);
    }
    function onEnd(){
      if(!isDragging)return;
      isDragging=false;row.style.transition='';
      if(Math.abs(currentX)>=THRESHOLD){
        triggerDelete(e.id,wrap,row);
      }else{
        row.style.transform='translateX(0)';bg.style.opacity=0;
      }
      currentX=0;
    }

    row.addEventListener('touchstart',ev=>onStart(ev.touches[0].clientX),{passive:true});
    row.addEventListener('touchmove',ev=>onMove(ev.touches[0].clientX),{passive:true});
    row.addEventListener('touchend',onEnd);
    let md=false;
    row.addEventListener('mousedown',ev=>{md=true;onStart(ev.clientX);ev.preventDefault();});
    document.addEventListener('mousemove',ev=>{if(md)onMove(ev.clientX);});
    document.addEventListener('mouseup',()=>{if(md){md=false;onEnd();}});
  });
}

async function triggerDelete(id,wrap,row){
  row.classList.add('deleting');
  setTimeout(async()=>{
    wrap.style.height='0';wrap.style.marginBottom='0';wrap.style.overflow='hidden';
    try{
      await deleteDoc(doc(db,'expenses',id));
      toast('Deleted','err');
    }catch(e){toast('Delete failed','err');console.error(e);}
  },290);
}

document.getElementById('exportBtn').onclick=async()=>{
  const btn=document.getElementById('exportBtn');
  btn.textContent='⏳ Generating...';btn.disabled=true;
  try{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'pt',format:'a4'});
    const expenses=getMonthExpenses();
    const total=expenses.reduce((s,e)=>s+e.amount,0);
    const W=doc.internal.pageSize.getWidth();
    let y=40;
    doc.setFontSize(24);doc.setTextColor(20,20,30);
    doc.text('flo. Expense Report',40,y);y+=18;
    doc.setFontSize(11);doc.setTextColor(100,105,120);
    doc.text(viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'}),40,y);y+=28;
    doc.setDrawColor(200,205,220);doc.line(40,y,W-40,y);y+=18;
    doc.setFontSize(12);doc.setTextColor(40,40,60);
    doc.text(`Total Spent: ${fmtAmt(total)}`,40,y);
    doc.text(`Transactions: ${expenses.length}`,240,y);y+=36;
    const charts=document.getElementById('chartsSection');
    const img=await html2canvas(charts,{backgroundColor:'#111318',scale:1.5,useCORS:true});
    const imgData=img.toDataURL('image/png');
    const imgH=(img.height/img.width)*(W-80);
    doc.addImage(imgData,'PNG',40,y,W-80,imgH);y+=imgH+20;
    if(y>700){doc.addPage();y=40;}
    doc.setFontSize(10);doc.setFillColor(240,240,248);doc.rect(40,y,W-80,16,'F');
    doc.setTextColor(60,60,90);
    doc.text('Date',50,y+11);doc.text('Category',160,y+11);doc.text('Amount',W-90,y+11);y+=20;
    expenses.forEach(e=>{
      if(y>780){doc.addPage();y=40;}
      doc.setFontSize(10);doc.setTextColor(50,55,70);
      doc.text(fmtDate(e.date),50,y);
      doc.text(e.category,160,y);
      doc.text(fmtAmt(e.amount),W-90,y);
      y+=15;
    });
    doc.save(`flo-${monthKey(viewDate)}.pdf`);
    toast('PDF saved! 📄');
  }catch(err){toast('Export failed','err');console.error(err);}
  btn.textContent='📄 Export PDF';btn.disabled=false;
};

updateMonthLabel();
</script>
