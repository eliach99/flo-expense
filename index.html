<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flo – Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --glass-bg:rgba(255,255,255,0.10);
    --glass-bg2:rgba(255,255,255,0.15);
    --glass-border:rgba(255,255,255,0.22);
    --glass-shadow:0 8px 32px rgba(0,0,0,0.22);
    --accent:#c084fc;
    --accent2:#60a5fa;
    --text:#fff;
    --text-muted:rgba(255,255,255,0.65);
    --danger:#f87171;
    --green:#4ade80;
    --radius:18px;
  }
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;
    font-family:'DM Sans',sans-serif;
    background:linear-gradient(135deg,#3b1d8e 0%,#1e3a8a 35%,#6b21a8 65%,#be185d 100%);
    background-attachment:fixed;
    color:var(--text);
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;opacity:0.5;
  }

  .container{max-width:1200px;margin:0 auto;padding:24px 20px;position:relative;z-index:1}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px}
  .logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-1px}
  .logo span{color:var(--accent)}
  .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .month-nav{display:flex;align-items:center;gap:8px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:50px;padding:6px 14px;backdrop-filter:blur(12px)}
  .month-nav button{background:none;border:none;color:var(--text);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:50%;transition:background .2s}
  .month-nav button:hover{background:rgba(255,255,255,0.15)}
  .month-label{font-family:'Syne',sans-serif;font-weight:600;font-size:.95rem;min-width:120px;text-align:center}
  .btn{font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:500;padding:10px 20px;border:none;border-radius:50px;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:linear-gradient(135deg,#a855f7,#3b82f6);color:#fff;box-shadow:0 4px 16px rgba(168,85,247,0.4)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(168,85,247,0.5)}
  .btn-ghost{background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text);backdrop-filter:blur(10px)}
  .btn-ghost:hover{background:var(--glass-bg2);transform:translateY(-1px)}
  .btn-danger{background:rgba(248,113,113,0.2);border:1px solid rgba(248,113,113,0.35);color:var(--danger)}
  .btn-danger:hover{background:rgba(248,113,113,0.35)}
  .btn-sm{padding:6px 12px;font-size:.8rem}

  .glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius);backdrop-filter:blur(14px);box-shadow:var(--glass-shadow);transition:transform .25s,box-shadow .25s}

  .add-panel{margin-bottom:28px;padding:24px 28px}
  .add-panel h2{font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;margin-bottom:16px;color:var(--text-muted)}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .form-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px}
  .form-group label{font-size:.8rem;font-weight:500;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase}
  .form-group input,.form-group select{
    background:rgba(255,255,255,0.08);
    border:1px solid var(--glass-border);
    border-radius:12px;
    padding:11px 14px;
    color:#fff;
    font-family:'DM Sans',sans-serif;
    font-size:.95rem;
    outline:none;
    transition:border .2s,background .2s;
    -webkit-appearance:none;
  }
  .form-group input:focus,.form-group select:focus{border-color:var(--accent);background:rgba(255,255,255,0.14)}
  .form-group select option{background:#2d1b69;color:#fff}
  .form-group input::placeholder{color:rgba(255,255,255,0.35)}
  input[type=number]::-webkit-inner-spin-button{opacity:.5}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{padding:22px 24px;position:relative;overflow:hidden}
  .stat-card::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.06),transparent);pointer-events:none}
  .stat-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,0.3)}
  .stat-icon{font-size:1.6rem;margin-bottom:8px}
  .stat-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:4px}
  .stat-value{font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:800;line-height:1}
  .stat-value.green{color:var(--green)}
  .stat-sub{font-size:.8rem;color:var(--text-muted);margin-top:4px}

  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  @media(max-width:680px){.charts-row{grid-template-columns:1fr}}
  .chart-card{padding:22px;min-height:280px;display:flex;flex-direction:column}
  .chart-card h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--text-muted)}
  .chart-wrap{flex:1;position:relative;min-height:200px}

  .table-card{padding:22px}
  .table-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
  .table-header h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}
  .expense-table{width:100%;border-collapse:collapse}
  .expense-table th{font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);padding:8px 12px;text-align:left;border-bottom:1px solid var(--glass-border)}
  .expense-table td{padding:11px 12px;font-size:.9rem;border-bottom:1px solid rgba(255,255,255,0.06);transition:background .15s}
  .expense-table tr:hover td{background:rgba(255,255,255,0.05)}
  .expense-table tr:last-child td{border-bottom:none}
  .expense-table td.amount{font-family:'Syne',sans-serif;font-weight:700;color:var(--accent)}
  .cat-badge{display:inline-block;padding:3px 10px;border-radius:50px;font-size:.75rem;background:rgba(255,255,255,0.1);border:1px solid var(--glass-border)}
  .empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:.95rem}
  .empty-state .icon{font-size:2.5rem;margin-bottom:8px}

  #toast{position:fixed;bottom:28px;right:28px;background:rgba(74,222,128,0.2);border:1px solid rgba(74,222,128,0.4);color:#4ade80;padding:12px 20px;border-radius:12px;backdrop-filter:blur(12px);font-size:.9rem;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
  #toast.show{opacity:1;transform:translateY(0)}

  @media(max-width:600px){
    .form-row{flex-direction:column}
    .form-group{min-width:100%}
    .stat-value{font-size:1.5rem}
    .logo{font-size:1.5rem}
    .expense-table th:nth-child(2),.expense-table td:nth-child(2){display:none}
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">flo<span>.</span></div>
    <div class="header-right">
      <div class="month-nav">
        <button id="prevMonth">&#8249;</button>
        <span class="month-label" id="monthLabel">–</span>
        <button id="nextMonth">&#8250;</button>
      </div>
      <button class="btn btn-ghost" id="exportBtn">📄 Export PDF</button>
    </div>
  </header>

  <div class="glass add-panel">
    <h2>➕ New Expense</h2>
    <div class="form-row">
      <div class="form-group" style="max-width:180px">
        <label>Amount ($)</label>
        <input type="number" id="amountInput" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group" style="flex:2">
        <label>Category</label>
        <select id="categoryInput">
          <option value="">Select category</option>
          <option>Restaurants</option><option>Bars</option><option>Fuel</option>
          <option>Personal</option><option>Shopping</option><option>Car Expenses</option>
          <option>Gym</option><option>Therapy</option><option>Gifts</option>
          <option>Leisure</option><option>Subscriptions</option><option>Health/Self-care</option><option>Others</option>
        </select>
      </div>
      <div class="form-group" style="max-width:170px">
        <label>Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group" style="max-width:120px;justify-content:flex-end">
        <button class="btn btn-primary" id="addBtn" style="width:100%;justify-content:center">Add</button>
      </div>
    </div>
  </div>

  <div class="summary-grid" id="summaryGrid">
    <div class="glass stat-card">
      <div class="stat-icon">💸</div>
      <div class="stat-label">Total Spent</div>
      <div class="stat-value" id="totalSpent">$0.00</div>
      <div class="stat-sub" id="totalSub">this month</div>
    </div>
    <div class="glass stat-card">
      <div class="stat-icon">🏆</div>
      <div class="stat-label">Top Category</div>
      <div class="stat-value" id="topCat" style="font-size:1.3rem">–</div>
      <div class="stat-sub" id="topCatAmt">–</div>
    </div>
    <div class="glass stat-card">
      <div class="stat-icon">📋</div>
      <div class="stat-label">Expenses</div>
      <div class="stat-value green" id="expCount">0</div>
      <div class="stat-sub">transactions</div>
    </div>
    <div class="glass stat-card">
      <div class="stat-icon">📊</div>
      <div class="stat-label">Daily Avg</div>
      <div class="stat-value" id="dailyAvg">$0.00</div>
      <div class="stat-sub">per day this month</div>
    </div>
  </div>

  <div class="charts-row" id="chartsSection">
    <div class="glass chart-card">
      <h3>By Category</h3>
      <div class="chart-wrap"><canvas id="doughnutChart"></canvas></div>
    </div>
    <div class="glass chart-card">
      <h3>Spending Over Time</h3>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>
  </div>

  <div class="glass table-card" id="tableSection">
    <div class="table-header">
      <h3>Expenses</h3>
    </div>
    <table class="expense-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Category</th>
          <th>Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="expenseBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="icon">🌿</div>
      <div>No expenses this month. Add one above!</div>
    </div>
  </div>

</div>
<div id="toast"></div>

<script>
const STORAGE_KEY = 'flo_expenses';
let viewDate = new Date();
let doughnutChart = null, barChart = null;

const CATEGORY_COLORS = {
  'Restaurants':'#f472b6','Bars':'#c084fc','Fuel':'#fb923c',
  'Personal':'#60a5fa','Shopping':'#34d399','Car Expenses':'#fbbf24',
  'Gym':'#4ade80','Therapy':'#a78bfa','Gifts':'#f87171',
  'Leisure':'#38bdf8','Subscriptions':'#e879f9','Health/Self-care':'#86efac','Others':'#94a3b8'
};

function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return [];}}
function save(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function fmtAmt(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtDate(s){
  const [y,m,d]=s.split('-');
  return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=type==='ok'?'rgba(74,222,128,0.2)':'rgba(248,113,113,0.2)';
  t.style.borderColor=type==='ok'?'rgba(74,222,128,0.4)':'rgba(248,113,113,0.4)';
  t.style.color=type==='ok'?'#4ade80':'#f87171';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function updateMonthLabel(){
  document.getElementById('monthLabel').textContent=viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const now=new Date();
  document.getElementById('nextMonth').style.opacity=
    (viewDate.getFullYear()===now.getFullYear()&&viewDate.getMonth()===now.getMonth())?'0.3':'1';
}
document.getElementById('prevMonth').onclick=()=>{
  viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);
  updateMonthLabel();render();
};
document.getElementById('nextMonth').onclick=()=>{
  const now=new Date();
  if(viewDate.getFullYear()===now.getFullYear()&&viewDate.getMonth()===now.getMonth())return;
  viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);
  updateMonthLabel();render();
};

document.getElementById('dateInput').value=new Date().toISOString().split('T')[0];
document.getElementById('addBtn').onclick=()=>{
  const amt=parseFloat(document.getElementById('amountInput').value);
  const cat=document.getElementById('categoryInput').value;
  const date=document.getElementById('dateInput').value;
  if(!amt||amt<=0){toast('Enter a valid amount','err');return;}
  if(!cat){toast('Pick a category','err');return;}
  if(!date){toast('Pick a date','err');return;}
  const data=load();
  data.push({id:Date.now(),amount:amt,category:cat,date});
  save(data);
  document.getElementById('amountInput').value='';
  document.getElementById('categoryInput').value='';
  document.getElementById('dateInput').value=new Date().toISOString().split('T')[0];
  const [y,m]=date.split('-');
  viewDate=new Date(parseInt(y),parseInt(m)-1,1);
  updateMonthLabel();
  render();
  toast('Expense added! 💸');
};

function getMonthExpenses(){
  const mk=monthKey(viewDate);
  return load().filter(e=>e.date.startsWith(mk)).sort((a,b)=>b.date.localeCompare(a.date));
}

function render(){
  const expenses=getMonthExpenses();
  renderStats(expenses);
  renderCharts(expenses);
  renderTable(expenses);
}

function renderStats(expenses){
  const total=expenses.reduce((s,e)=>s+e.amount,0);
  document.getElementById('totalSpent').textContent=fmtAmt(total);
  document.getElementById('expCount').textContent=expenses.length;
  const catTotals={};
  expenses.forEach(e=>{catTotals[e.category]=(catTotals[e.category]||0)+e.amount});
  const sorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  if(sorted.length){
    document.getElementById('topCat').textContent=sorted[0][0];
    document.getElementById('topCatAmt').textContent=fmtAmt(sorted[0][1]);
  }else{
    document.getElementById('topCat').textContent='–';
    document.getElementById('topCatAmt').textContent='–';
  }
  const now=new Date();
  const isCurrentMonth=viewDate.getFullYear()===now.getFullYear()&&viewDate.getMonth()===now.getMonth();
  const daysElapsed=isCurrentMonth?now.getDate():new Date(viewDate.getFullYear(),viewDate.getMonth()+1,0).getDate();
  document.getElementById('dailyAvg').textContent=fmtAmt(daysElapsed?total/daysElapsed:0);
}

function renderCharts(expenses){
  const catTotals={};
  expenses.forEach(e=>{catTotals[e.category]=(catTotals[e.category]||0)+e.amount});
  const labels=Object.keys(catTotals);
  const values=labels.map(l=>catTotals[l]);
  const colors=labels.map(l=>CATEGORY_COLORS[l]||'#94a3b8');

  if(doughnutChart)doughnutChart.destroy();
  doughnutChart=new Chart(document.getElementById('doughnutChart'),{
    type:'doughnut',
    data:{labels,datasets:[{data:values,backgroundColor:colors.map(c=>c+'cc'),borderColor:colors,borderWidth:2,hoverOffset:8}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:'bottom',labels:{color:'rgba(255,255,255,0.75)',font:{family:'DM Sans',size:11},padding:12,boxWidth:12}},
        tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmtAmt(ctx.parsed)}`}}
      },
      animation:{animateScale:true,duration:700}
    }
  });

  const dayTotals={};
  expenses.forEach(e=>{dayTotals[e.date]=(dayTotals[e.date]||0)+e.amount});
  const dayLabels=Object.keys(dayTotals).sort();
  const dayValues=dayLabels.map(d=>dayTotals[d]);
  const shortLabels=dayLabels.map(d=>fmtDate(d));

  if(barChart)barChart.destroy();
  barChart=new Chart(document.getElementById('barChart'),{
    type:'bar',
    data:{
      labels:shortLabels,
      datasets:[{
        label:'Spending',data:dayValues,
        backgroundColor:'rgba(168,85,247,0.55)',
        borderColor:'#a855f7',borderWidth:2,borderRadius:8,
        hoverBackgroundColor:'rgba(168,85,247,0.8)'
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${fmtAmt(ctx.parsed.y)}`}}},
      scales:{
        x:{ticks:{color:'rgba(255,255,255,0.6)',font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'},border:{display:false}},
        y:{ticks:{color:'rgba(255,255,255,0.6)',font:{size:10},callback:v=>'$'+v},grid:{color:'rgba(255,255,255,0.07)'},border:{display:false}}
      },
      animation:{duration:600}
    }
  });
}

function renderTable(expenses){
  const body=document.getElementById('expenseBody');
  const empty=document.getElementById('emptyState');
  body.innerHTML='';
  if(!expenses.length){empty.style.display='block';return;}
  empty.style.display='none';
  expenses.forEach(e=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${fmtDate(e.date)}</td>
      <td><span class="cat-badge" style="border-color:${CATEGORY_COLORS[e.category]||'#888'}44;color:${CATEGORY_COLORS[e.category]||'#ccc'}">${e.category}</span></td>
      <td class="amount">${fmtAmt(e.amount)}</td>
      <td><button class="btn btn-danger btn-sm del-btn" data-id="${e.id}">✕</button></td>
    `;
    body.appendChild(tr);
  });
  body.querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick=()=>{
      const data=load().filter(e=>String(e.id)!==btn.dataset.id);
      save(data);render();toast('Deleted','err');
    };
  });
}

document.getElementById('exportBtn').onclick=async()=>{
  const btn=document.getElementById('exportBtn');
  btn.textContent='⏳ Generating...';btn.disabled=true;
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'pt',format:'a4'});
    const expenses=getMonthExpenses();
    const total=expenses.reduce((s,e)=>s+e.amount,0);
    const W=doc.internal.pageSize.getWidth();
    let y=40;

    doc.setFontSize(26);doc.setTextColor(80,0,120);
    doc.text('flo. Expense Report',40,y);y+=20;
    doc.setFontSize(11);doc.setTextColor(100,100,120);
    doc.text(viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'}),40,y);y+=30;

    doc.setDrawColor(200,180,230);doc.line(40,y,W-40,y);y+=20;

    doc.setFontSize(12);doc.setTextColor(40,40,60);
    doc.text(`Total Spent: ${fmtAmt(total)}`,40,y);
    doc.text(`Transactions: ${expenses.length}`,220,y);y+=40;

    const charts=document.getElementById('chartsSection');
    const cImg=await html2canvas(charts,{backgroundColor:'#1e1b4b',scale:1.5,useCORS:true});
    const cData=cImg.toDataURL('image/png');
    const cH=(cImg.height/cImg.width)*(W-80);
    doc.addImage(cData,'PNG',40,y,W-80,cH);y+=cH+20;

    if(y>700){doc.addPage();y=40;}
    doc.setFontSize(11);doc.setFillColor(230,220,255);doc.rect(40,y,W-80,18,'F');
    doc.setTextColor(60,0,100);
    doc.text('Date',50,y+13);doc.text('Category',150,y+13);doc.text('Amount',W-100,y+13);
    y+=22;

    expenses.forEach(e=>{
      if(y>780){doc.addPage();y=40;}
      doc.setFontSize(10);doc.setTextColor(50,50,70);
      doc.text(fmtDate(e.date),50,y);
      doc.text(e.category,150,y);
      doc.text(fmtAmt(e.amount),W-100,y);
      y+=16;
    });

    doc.save(`flo-${monthKey(viewDate)}.pdf`);
    toast('PDF exported! 📄');
  }catch(err){toast('Export failed','err');console.error(err);}
  btn.textContent='📄 Export PDF';btn.disabled=false;
};

updateMonthLabel();render();
</script>
</body>
</html>
